name: Deploy Staring at the Ceiling to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  issues:
    types: [ opened ]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Process Issue into Blog Post
        if: github.event_name == 'issues'
        id: publish
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          node scripts/publish-issue.mjs

      - name: Commit and push new post
        if: github.event_name == 'issues' && steps.publish.outputs.post_path != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git commit -m "publish: ${{ steps.publish.outputs.title }} (via #${{ github.event.issue.number }})"
          git push origin main

      - name: Close issue with confirmation
        if: github.event_name == 'issues' && steps.publish.outputs.post_path != ''
        uses: actions/github-script@v7
        with:
          script: |
            const slug = '${{ steps.publish.outputs.slug }}';
            const owner = context.repo.owner.toLowerCase();
            const repo = context.repo.repo;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✨ **Published!** Your note is now live at:\nhttps://${owner}.github.io/${repo}/blog/${slug}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
